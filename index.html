<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Institute for Educational Accountability | Independent School Evaluation in Nepal</title>
    <meta
      name="description"
      content="An independent examination of Nepali schools, grounded in verified student testimony, field inquiry, and credible public sources, undertaken to illuminate the institutions entrusted with educating the next generation."
    />
    <meta name="theme-color" content="#f4ecd8" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Institute for Educational Accountability",
        "alternateName": "IEA",
        "url": "https://www.ieainstitute.org/"
      }
    </script>
    <!-- One favicon set, all generated from the official logo (public/icon-512.png). -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-48x48.png" type="image/png" sizes="48x48" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="icon" href="/icon-512.png" type="image/png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      No static <link rel="canonical"> here on purpose: Vite's HTML plugin
      tries to resolve `href` values as build assets, and a bare "/" is a
      directory. The canonical URL is set per route in Phase 4.
    -->

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Institute for Educational Accountability" />
    <meta property="og:title" content="Institute for Educational Accountability" />
    <meta property="og:url" content="https://www.ieainstitute.org/" />
    <meta
      property="og:description"
      content="An independent examination of Nepali schools, grounded in verified student testimony, field inquiry, and credible public sources, undertaken to illuminate the institutions entrusted with educating the next generation."
    />
    <meta property="og:image" content="https://www.ieainstitute.org/og-logo.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Official logo of the Institute for Educational Accountability" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Institute for Educational Accountability" />
    <meta name="twitter:image" content="https://www.ieainstitute.org/og-logo.png" />

    <!--
      Preload only the two faces used above the fold: the Roman bold for
      headlines and the Sans regular for interface. The other two load on first
      use. All four are immutable, so this is a one-time cost per visitor.
      `crossorigin` is required even same-origin: fonts are always fetched in
      CORS mode.
    -->
    <link rel="preload" href="/fonts/latin-modern-roman-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/latin-modern-sans-400.woff2" as="font" type="font/woff2" crossorigin />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
